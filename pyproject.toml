[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrialedge-ai"
version = "0.1.0"
description = "Production-style industrial AI platform for real-time machine monitoring and predictive maintenance."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Berkant Duman"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "paho-mqtt>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pandas>=2.2",
  "requests>=2.32",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
